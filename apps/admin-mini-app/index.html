<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Student Dashboard — view your schedule, progress, and profile" />
    <title>Student Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
  <style>
    body {
      background-color: var(--tg-theme-secondary-bg-color, #f1f5f9);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .clay-spinner {
      width: 60px;
      height: 60px;
      background: #0D9488;
      border-radius: 20px;
      box-shadow: 
        inset 6px 6px 12px rgba(255,255,255,0.5),
        inset -6px -6px 12px rgba(0,0,0,0.15),
        0 12px 24px rgba(13,148,136,0.3);
      animation: clay-spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite alternate;
    }
    @keyframes clay-spin {
      0% { transform: scale(0.8) rotate(0deg); border-radius: 16px; }
      100% { transform: scale(1.1) rotate(180deg); border-radius: 30px; background: #2DD4BF; }
    }
    .app-boot-text {
      margin-top: 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--tg-theme-hint-color, #6b7280);
      letter-spacing: 0.5px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
  <div class="app-boot-loader">
    <div class="clay-spinner"></div>
    <div class="app-boot-text">Загрузка...</div>
  </div>
</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
