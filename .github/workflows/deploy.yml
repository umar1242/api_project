name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "── Pulling latest code ──────────────────────"
            git pull origin main

            echo "── Building & starting containers ───────────"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "── Running database migrations ──────────────"
            docker compose exec -T api npx prisma migrate deploy

            echo "── Cleaning up unused images ─────────────────"
            docker image prune -f

            echo "── Done ─────────────────────────────────────"

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   VPS_HOST      — IP address or hostname of your VPS
#   VPS_USER      — SSH username (e.g., ubuntu, deploy)
#   VPS_SSH_KEY   — Private SSH key (the server must have the public key in authorized_keys)
#   VPS_PORT      — SSH port (optional, defaults to 22)
#   DEPLOY_PATH   — Absolute path to the project on the server (e.g., /home/deploy/botnet)
# ─────────────────────────────────────────────────────────────────────────────
