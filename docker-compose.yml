services:
  api:
    build:
      context: ./apps/api
      target: dev
    ports:
    - 3000:3000
    volumes:
    - ./apps/api:/app
    - /app/node_modules
    env_file:
    - .env
    environment:
    - NODE_ENV=development
    - PORT=3000
    - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-botnet_dev}?schema=public
    - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: npm run start:dev
    networks:
    - backend-net
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  admin-bot:
    build:
      context: ./apps/admin-bot
      target: dev
    volumes:
    - ./apps/admin-bot:/app
    - /app/node_modules
    env_file:
    - .env
    environment:
    - NODE_ENV=development
    - API_BASE_URL=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
    - backend-net
  db:
    image: postgres:16-alpine
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-botnet_dev}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER:-postgres}
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
    - backend-net
  redis:
    image: redis:7-alpine
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
    - backend-net
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
    - miniodata:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
    - backend-net

  registrar-bot:
    build:
      context: ./apps/registrar-bot
      target: dev
    volumes:
    - ./apps/registrar-bot:/app
    - /app/node_modules
    env_file:
    - .env
    environment:
    - NODE_ENV=development
    - API_BASE_URL=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
    - backend-net
  registrar-mini-app:
    build:
      context: ./apps/registrar-mini-app
      target: dev
    ports:
    - 5173:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - ./apps/registrar-mini-app:/app
    - /app/node_modules
    env_file:
    - .env
    environment:
    - NODE_ENV=development
    networks:
    - backend-net
  main-bot:
    build:
